name: Release

on:
  push:
    tags: ["v*"]
  # Déclenchement manuel : le workflow crée lui-même le tag sur le commit choisi.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.2.0)"
        required: true


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # « 0.5.1 » ou « v0.5.1 » → tag v0.5.1 (une saisie sans « v » créait une release à part)
      - name: Version
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          V="$(echo "$RAW" | tr -d '[:space:]')"
          V="v${V#v}"
          if ! echo "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide : « $RAW » (attendu : 0.5.1 ou v0.5.1)"; exit 1
          fi
          echo "TAG=$V" >> "$GITHUB_ENV"

      # Clé de signature : secrets FRESKO_KEYSTORE_B64, FRESKO_KEYSTORE_PASSWORD,
      # FRESKO_KEY_ALIAS, FRESKO_KEY_PASSWORD. Sans eux la release échoue (un APK signé
      # avec une clé temporaire ne s'installerait pas par-dessus la version précédente).
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.FRESKO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret FRESKO_KEYSTORE_B64 absent : voir « Clé de signature » dans le README."; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fresko.jks"
          echo "FRESKO_KEYSTORE_FILE=$RUNNER_TEMP/fresko.jks" >> "$GITHUB_ENV"

      - name: Tests unitaires
        run: ./gradlew test

      - name: APK release
        env:
          FRESKO_KEYSTORE_PASSWORD: ${{ secrets.FRESKO_KEYSTORE_PASSWORD }}
          FRESKO_KEY_ALIAS: ${{ secrets.FRESKO_KEY_ALIAS }}
          FRESKO_KEY_PASSWORD: ${{ secrets.FRESKO_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "fresko-${TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Fresko ${{ env.TAG }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: fresko-${{ env.TAG }}.apk
