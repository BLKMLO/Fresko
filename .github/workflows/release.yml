name: Release

on:
  push:
    tags: ["v*"]
  # Déclenchement manuel : le workflow crée lui-même le tag sur le commit choisi.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.2.0)"
        required: true

env:
  TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Clé de signature stable (facultative) : secrets FRESKO_KEYSTORE_B64,
      # FRESKO_KEYSTORE_PASSWORD, FRESKO_KEY_ALIAS, FRESKO_KEY_PASSWORD.
      # Sans eux, l'APK est signé avec la clé debug de la CI (change à chaque run).
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.FRESKO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fresko.jks"
            echo "FRESKO_KEYSTORE_FILE=$RUNNER_TEMP/fresko.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de release : APK signé avec la clé debug de la CI."
          fi

      - name: Tests unitaires
        run: ./gradlew test

      - name: APK release
        env:
          FRESKO_KEYSTORE_PASSWORD: ${{ secrets.FRESKO_KEYSTORE_PASSWORD }}
          FRESKO_KEY_ALIAS: ${{ secrets.FRESKO_KEY_ALIAS }}
          FRESKO_KEY_PASSWORD: ${{ secrets.FRESKO_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "fresko-${TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Fresko ${{ env.TAG }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: fresko-${{ env.TAG }}.apk
